{{define "content"}}
<h1>Sign in</h1>
{{if .localAuth}}
<form method="post" action="{{route "/login"}}">
  <input type="hidden" name="redirect_url" value="{{.redirectURL}}">
  <input name="username" value="{{.username}}" placeholder="Username" aria-label="Username" autocomplete="username webauthn" required autofocus>
  <input type="password" name="password" placeholder="Password" aria-label="Password" autocomplete="current-password" required>
  <button>Sign in</button>
</form>
{{end}}
{{if .webAuthnEnabled}}
<p><button type="button" data-webauthn="login" disabled>Sign in with a passkey</button></p>
{{end}}
{{if .oauth2}}
<p><a href="{{route "/oauth2/%s/redirect" .oauth2}}">Sign in with {{.oauth2Name}}</a></p>
{{end}}
{{end}}
