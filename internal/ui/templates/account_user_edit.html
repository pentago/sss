{{define "content"}}
<h1>Edit user: {{.selected.Username}}</h1>
{{template "settings_nav" .}}
<form method="post" action="{{route "/users/%d/update" .selected.ID}}">
  <fieldset>
    <legend>User</legend>
    <label>Username <input name="username" value="{{.form.Username}}" autocomplete="off" required></label>
    <label>New password (leave empty to keep it) <input type="password" name="password" autocomplete="new-password" minlength="6"></label>
    <label>Confirmation <input type="password" name="confirmation" autocomplete="new-password"></label>
    <label><input type="checkbox" name="is_admin"{{if .form.IsAdmin}} checked{{end}}> Administrator</label>
  </fieldset>
  <button>Save</button>
</form>
{{end}}
