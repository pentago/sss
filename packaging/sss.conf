# sss configuration: one KEY=VALUE per line, same names as the environment
# variables documented in the README. Environment variables override this file.

RUN_MIGRATIONS=1

# Address to listen on (host:port or a Unix socket path).
# LISTEN_ADDR=127.0.0.1:8080

# Public URL when served behind a reverse proxy.
# BASE_URL=https://reader.example.org/

# SQLite database path. Default: $XDG_DATA_HOME/sss/sss.db
# (~/.local/share/sss/sss.db for users, /var/lib/sss/sss.db for the system service).
# DATABASE_PATH=/path/to/sss.db

# Create an admin account on startup.
# CREATE_ADMIN=1
# ADMIN_USERNAME=admin
# ADMIN_PASSWORD=change-me

# Number of background feed refresh workers / feeds per batch.
# WORKER_POOL_SIZE=16
# BATCH_SIZE=100

# Minutes between scheduler runs / minimum minutes between checks of one feed.
# POLLING_FREQUENCY=60
# SCHEDULER_ROUND_ROBIN_MIN_INTERVAL=60

# Logging.
# LOG_LEVEL=info
# LOG_FORMAT=text
